<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>{% block title %}Admin · Anti-Reteste{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><rect width='20' height='20' rx='5' fill='%23E15155'/><path d='M10 3.2l5.4 2.3v3.4c0 3.2-2.1 5.6-5.4 6.7-3.3-1.1-5.4-3.5-5.4-6.7V5.5z' fill='none' stroke='%23fff' stroke-width='1.3'/></svg>">
<link rel="stylesheet" href="{{ static_url('app.css') }}">
{% block head %}{% endblock %}
</head>
<body class="adm">
<div class="grade" aria-hidden="true"></div>

{% block shell %}
<header class="adm-topo">
  <div class="adm-topo-in">
    <a href="/admin/painel" class="adm-marca">
      <span class="adm-escudo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7 3v5c0 4.6-3 8-7 9.5-4-1.5-7-4.9-7-9.5v-5z"/><path d="M9 12l2 2 4-4"/></svg>
      </span>
      <span class="adm-marca-txt">
        <strong>Anti-Reteste</strong>
        <span>Painel administrativo</span>
      </span>
    </a>
    <nav class="adm-nav" aria-label="Seções do admin">
      <a href="/admin/painel" class="adm-link{% if aba_ativa == 'painel' %} on{% endif %}">Painel</a>
      <a href="/admin/cartoes" class="adm-link{% if aba_ativa == 'cartoes' %} on{% endif %}">Cartões</a>
    </nav>
    <div class="adm-topo-fim">
      {% if stats %}<span class="adm-chip" data-tip="Cartões na base">{{ n(stats.total) }} cartões</span>{% endif %}
      <a href="/admin/logout" class="adm-sair">Sair</a>
    </div>
  </div>
</header>
<main class="adm-main">
{% block content %}{% endblock %}
</main>
{% endblock %}

{% block scripts %}{% endblock %}
</body>
</html>
