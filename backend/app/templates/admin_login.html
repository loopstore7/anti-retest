{% extends "admin_base.html" %}
{% block title %}Acesso · Admin Anti-Reteste{% endblock %}

{% block shell %}
<main class="adm-login-wrap">
  <section class="adm-login">
    <div class="adm-login-escudo" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l7 3v5c0 4.6-3 8-7 9.5-4-1.5-7-4.9-7-9.5v-5z"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <h1 class="adm-login-tit">Área restrita</h1>
    <p class="adm-login-sub">Acesso monitorado. Tentativas de login são registradas e limitadas.</p>

    {% if erro %}<p class="adm-alert erro" role="alert">{{ erro }}</p>{% endif %}

    <form method="post" action="{{ login_action|default('/') }}" class="adm-form" autocomplete="off">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label class="adm-campo">
        <span>Usuário</span>
        <input name="username" required autocapitalize="off" autocomplete="username" spellcheck="false">
      </label>
      <label class="adm-campo">
        <span>Senha</span>
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="adm-btn primario">Entrar</button>
    </form>
  </section>
</main>
{% endblock %}
