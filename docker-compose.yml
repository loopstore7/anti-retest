services:
  postgres:
    image: postgres:16-alpine
    container_name: anti-retest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antiretest}
      POSTGRES_USER: ${POSTGRES_USER:-antiretest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antiretest}
    volumes:
      - anti-retest-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antiretest} -d ${POSTGRES_DB:-antiretest}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: anti-retest-api:latest
    container_name: anti-retest-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antiretest}:${POSTGRES_PASSWORD:-antiretest}@postgres:5432/${POSTGRES_DB:-antiretest}
      ANTIRETEST_LOG_DIR: /data/registros
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      CX2_ADMIN_USER: ${CX2_ADMIN_USER:-}
      CX2_ADMIN_PASSWORD_HASH: ${CX2_ADMIN_PASSWORD_HASH:-}
      ADMIN_HOST: ${ADMIN_HOST:-}
    volumes:
      - anti-retest-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: anti-retest-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro

  migrate:
    profiles: ["migrate"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: anti-retest-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antiretest}:${POSTGRES_PASSWORD:-antiretest}@postgres:5432/${POSTGRES_DB:-antiretest}
      SQLITE_PATH: /backup/antiretest-20260923-172405.db
      MIGRATE_BATCH: "10000"
    volumes:
      - ./backups:/backup
    command: ["python", "/app/scripts/migrate_sqlite_to_postgres.py"]

  migrate-fp:
    profiles: ["migrate-fp"]
    image: anti-retest-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antiretest}:${POSTGRES_PASSWORD:-antiretest}@postgres:5432/${POSTGRES_DB:-antiretest}
    command: ["python", "/app/scripts/migrate_fp_cartao.py"]

  import-txt:
    profiles: ["import"]
    image: anti-retest-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antiretest}:${POSTGRES_PASSWORD:-antiretest}@postgres:5432/${POSTGRES_DB:-antiretest}
      IMPORT_BATCH: ${IMPORT_BATCH:-5000}
    volumes:
      - ./all:/import:ro
    command: ["python", "/app/scripts/import_txt_to_postgres.py", "/import/1.txt", "/import/2.txt"]

  import-txt-fast:
    profiles: ["import"]
    image: anti-retest-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antiretest}:${POSTGRES_PASSWORD:-antiretest}@postgres:5432/${POSTGRES_DB:-antiretest}
      IMPORT_BATCH: ${IMPORT_BATCH:-50000}
      IMPORT_READ_CHUNK: ${IMPORT_READ_CHUNK:-20000}
      IMPORT_WORKERS: ${IMPORT_WORKERS:-4}
      IMPORT_DROP_INDEXES: ${IMPORT_DROP_INDEXES:-1}
    volumes:
      - ./all:/import:ro
    command: ["python", "/app/scripts/import_txt_to_postgres_fast.py", "/import/1.txt", "/import/2.txt"]

  import-antrt:
    profiles: ["import"]
    image: anti-retest-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-antiretest}:${POSTGRES_PASSWORD:-antiretest}@postgres:5432/${POSTGRES_DB:-antiretest}
      IMPORT_BATCH: ${IMPORT_BATCH:-50000}
      IMPORT_READ_CHUNK: ${IMPORT_READ_CHUNK:-20000}
      IMPORT_WORKERS: ${IMPORT_WORKERS:-4}
      IMPORT_DROP_INDEXES: ${IMPORT_DROP_INDEXES:-1}
    volumes:
      - ./antrt:/antrt:ro
      - ./scripts/import_all_in_dir.sh:/scripts/import_all_in_dir.sh:ro
    command: ["bash", "/scripts/import_all_in_dir.sh", "/antrt"]

volumes:
  anti-retest-pg:
  anti-retest-data:
