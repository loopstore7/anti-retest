upstream anti_retest_web {
    server 127.0.0.1:8082;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name antiretest.com www.antiretest.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name antiretest.com www.antiretest.com;

    ssl_certificate     /etc/letsencrypt/live/antiretest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antiretest.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16m;

    location / {
        proxy_pass http://anti_retest_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
